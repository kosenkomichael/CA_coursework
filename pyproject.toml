[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdlp-python"
version = "0.1.0"
description = "Elliptic Curve Discrete Logarithm Problem solver using Pollard rho"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kirill" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
ecdlp = "ecdlp.cli:main"
tests = "ecdlp.test_runner:run_test_file"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]